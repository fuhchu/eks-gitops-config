# API gateway — sync-wave 2 (last; it proxies to users and items). Owns the
# Ingress that the AWS Load Balancer Controller turns into a public ALB.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/fuhchu/eks-gitops-config.git
    targetRevision: main
    path: charts/api-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: eks-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
