# Items — sync-wave 1 (alongside users; both depend on postgres).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: items
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/fuhchu/eks-gitops-config.git
    targetRevision: main
    path: charts/items
  destination:
    server: https://kubernetes.default.svc
    namespace: eks-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
