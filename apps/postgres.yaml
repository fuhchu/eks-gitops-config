# Postgres — sync-wave 0 so its Service + Secret + StatefulSet exist before the
# services whose initContainers wait on `pg_isready`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/fuhchu/eks-gitops-config.git
    targetRevision: main
    path: charts/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: eks-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
