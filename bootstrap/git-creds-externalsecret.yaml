# Materializes the git write credential into the argocd namespace, where Argo CD
# Image Updater looks for it.
#
# Same Secrets Manager -> ESO -> native Kubernetes Secret pattern already used
# for the Postgres password. The PAT itself was written to Secrets Manager
# out-of-band, so it exists in exactly one place and never in git or Terraform
# state. Rotating it = update Secrets Manager; ESO re-syncs within the hour.
#
# Applied once, after ESO is installed:
#     kubectl apply -f bootstrap/git-creds-externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: git-creds
  # MUST be argocd — Image Updater reads the secret from its own namespace.
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: git-creds
    creationPolicy: Owner
  # Mapped 1:1 with no templating. Image Updater's HTTPS git auth expects
  # exactly these two keys.
  data:
    - secretKey: username
      remoteRef:
        key: eks-gitops/git-creds
        property: username
    - secretKey: password
      remoteRef:
        key: eks-gitops/git-creds
        property: password
