# Helm values for the AWS Load Balancer Controller (installed into kube-system).
# One-time bootstrap install:
#   helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
#     -n kube-system -f bootstrap/lb-controller-values.yaml --set vpcId=<VPC_ID>
#
# vpcId is passed on the CLI because it's dynamic per apply. Everything stable
# lives here.
clusterName: eks-gitops
region: us-west-2

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    # IRSA: the controller pod assumes this role via its ServiceAccount. The
    # role's trust policy is locked to exactly kube-system/aws-load-balancer-controller.
    eks.amazonaws.com/role-arn: arn:aws:iam::445481011516:role/eks-gitops-lb-controller
