# A ClusterSecretStore tells External Secrets Operator HOW and WHERE to fetch
# secrets. "Cluster" scope (vs. a namespaced SecretStore) means any namespace's
# ExternalSecret can reference it.
#
# No `auth` block: the AWS provider falls back to the ESO controller pod's own
# credentials, which come from the IRSA role annotation on the external-secrets
# ServiceAccount (created by Terraform in infra/). That role is scoped to
# GetSecretValue on exactly the eks-gitops/postgres secret.
#
# This is a one-time bootstrap resource, applied after ESO is installed and
# before the root app-of-apps:
#     kubectl apply -f bootstrap/cluster-secret-store.yaml
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
